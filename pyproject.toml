[project]
name = "construct-psg"
version = "0.1.0"
description = "Symmetric parser generator for Python constructs in C, GLSL and Python"
license = "GPLv3"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dependency-injector (>=4.0.0,<5.0.0)",
    "Jinja2 (>=3.0.0,<4.0.0)",
    "termcolor (>=2.0.0,<3.0.0)",
    "construct (>=2.0.0,<3.0.0)",
]

[[project.authors]]
name = "Alexander Kraus"
email = "nr4@z10.info>"

[tool.poetry]
packages = [{include = "construct_psg"}]

[tool.poetry.group.dev.dependencies]
pygit2 = ">=1.12.2,<2.0.0"
pyinstaller = ">=6.0.0,<7.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
